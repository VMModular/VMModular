name: Deploy to Hostinger VPS

on:
  push:
    branches: [ main, feature/deployment-ready ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        env:
          DOMAIN_NAME: ${{ secrets.DOMAIN || secrets.HOST }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ENABLE_DEV_LOGIN: ${{ secrets.ENABLE_DEV_LOGIN || 'false' }}
          BASIC_AUTH_USER: ${{ secrets.BASIC_AUTH_USER }}
          BASIC_AUTH_PASS: ${{ secrets.BASIC_AUTH_PASS }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          envs: DOMAIN_NAME,JWT_SECRET,ENABLE_DEV_LOGIN,BASIC_AUTH_USER,BASIC_AUTH_PASS
          script: |
            # Navigate to application directory
            mkdir -p ~/vm-crm
            cd ~/vm-crm

            # Pull latest changes (using the branch that triggered the action)
            if [ ! -d .git ]; then
              git clone -b ${{ github.ref_name }} https://github.com/${{ github.repository }}.git .
            else
              git fetch --all
              git reset --hard origin/${{ github.ref_name }}
            fi

            # Resolve protocol
            PROTOCOL=$([[ -n "${{ secrets.DOMAIN }}" ]] && echo "https" || echo "http")

            # Create/Update production .env files safely
            cat <<EOF > backend/.env
            PORT=4000
            NODE_ENV=production
            ENABLE_DEV_LOGIN=$ENABLE_DEV_LOGIN
            JWT_SECRET=$JWT_SECRET
            DATABASE_URL=file:./data/vmcrm.db
            FRONTEND_URL=$PROTOCOL://$DOMAIN_NAME
            ALLOWED_ORIGINS=$PROTOCOL://$DOMAIN_NAME,http://localhost
            EOF

            # Create Caddy env file safely using printf
            # We must double the $ signs ($$) because Docker Compose tries to expand them
            printf "DOMAIN=%s\n" "$DOMAIN_NAME" > .env.caddy
            printf "BASIC_AUTH_USER=%s\n" "$BASIC_AUTH_USER" >> .env.caddy
            printf "BASIC_AUTH_PASS=%s\n" "$BASIC_AUTH_PASS" | sed 's/\$/$$/g' >> .env.caddy

            # Ensure scripts are executable
            chmod +x setup.sh startup.sh

            # Run setup
            if ! ./setup.sh; then
              echo "::error::Setup failed. Showing backend logs:"
              docker compose logs backend
              exit 1
            fi

            # Force Caddy to reload/restart to pick up Caddyfile changes
            docker compose restart caddy
