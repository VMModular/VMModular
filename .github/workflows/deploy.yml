name: Deploy to Hostinger VPS

on:
  push:
    branches: [ main, feature/deployment-ready ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            # Navigate to application directory
            mkdir -p ~/vm-crm
            cd ~/vm-crm

            # Pull latest changes (using the branch that triggered the action)
            if [ ! -d .git ]; then
              git clone -b ${{ github.ref_name }} https://github.com/${{ github.repository }}.git .
            else
              git fetch --all
              git reset --hard origin/${{ github.ref_name }}
            fi

            # Create/Update production .env files
            # We use the secrets passed from GitHub
            DOMAIN=${{ secrets.DOMAIN || secrets.HOST }}
            PROTOCOL=$([[ "${{ secrets.DOMAIN }}" != "" ]] && echo "https" || echo "http")
            
            cat <<EOF > backend/.env
            PORT=4000
            NODE_ENV=production
            ENABLE_DEV_LOGIN=${{ secrets.ENABLE_DEV_LOGIN || 'false' }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            DATABASE_URL=file:./data/vmcrm.db
            FRONTEND_URL=$PROTOCOL://\$DOMAIN
            ALLOWED_ORIGINS=$PROTOCOL://\$DOMAIN,http://localhost
            EOF

            # Also set DOMAIN for docker-compose
            export DOMAIN=\$DOMAIN

            # Ensure scripts are executable
            chmod +x setup.sh startup.sh

            # Run setup (this builds and starts containers)
            # We use --build to ensure code changes are picked up
            ./setup.sh
