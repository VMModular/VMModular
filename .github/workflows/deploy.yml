name: Deploy to Hostinger VPS

on:
  push:
    branches: [ main, feature/deployment-ready ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            # Navigate to application directory
            mkdir -p ~/vm-crm
            cd ~/vm-crm

            # Pull latest changes (using the branch that triggered the action)
            if [ ! -d .git ]; then
              git clone -b ${{ github.ref_name }} https://github.com/${{ github.repository }}.git .
            else
              git fetch --all
              git reset --hard origin/${{ github.ref_name }}
            fi

            # Resolve variables and assign to shell vars to avoid heredoc expansion issues
            export DOMAIN_NAME="${{ secrets.DOMAIN || secrets.HOST }}"
            export PROTOCOL=$([[ -n "${{ secrets.DOMAIN }}" ]] && echo "https" || echo "http")
            export JWT_SECRET="${{ secrets.JWT_SECRET }}"
            export ENABLE_DEV_LOGIN="${{ secrets.ENABLE_DEV_LOGIN || 'false' }}"

            # Create/Update production .env files using a safe method
            cat <<'EOF' > backend/.env
PORT=4000
NODE_ENV=production
EOF
            echo "ENABLE_DEV_LOGIN=$ENABLE_DEV_LOGIN" >> backend/.env
            echo "JWT_SECRET=$JWT_SECRET" >> backend/.env
            echo "DATABASE_URL=file:./data/vmcrm.db" >> backend/.env
            echo "FRONTEND_URL=$PROTOCOL://$DOMAIN_NAME" >> backend/.env
            echo "ALLOWED_ORIGINS=$PROTOCOL://$DOMAIN_NAME,http://localhost" >> backend/.env

            # Export variables for docker-compose.yml
            export DOMAIN=$DOMAIN_NAME
            export BASIC_AUTH_USER="${{ secrets.BASIC_AUTH_USER }}"
            export BASIC_AUTH_PASS="${{ secrets.BASIC_AUTH_PASS }}"

            # Ensure scripts are executable
            chmod +x setup.sh startup.sh

            # Run setup
            if ! ./setup.sh; then
              echo "::error::Setup failed. Showing backend logs:"
              docker compose logs backend
              exit 1
            fi
